<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Slow Ink Life — Digital Planner</title>
    <meta
      name="description"
      content="Slow Ink Life is a soft, neumorphic all-in-one digital planner — linked yearly, monthly, weekly and daily spreads with reflection reviews, plus hubs for habits and fitness, meals, finance, mental wellbeing, travel, home care and a multi-paper notebook."
    />
    <meta name="theme-color" content="#EFEBE7" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23EFEBE7'/%3E%3Ccircle cx='20' cy='20' r='11' fill='%23F2C4CE'/%3E%3Ccircle cx='24' cy='16' r='5' fill='%23F7E3A1'/%3E%3C/svg%3E"
    />
    <script>
      /* apply the saved look before the page paints, so there is no flash of the wrong colours */
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("slow-ink-life-v1") || "null") || {}, l = s.look || {}, d = document.documentElement;
          function pick(v, list, def) { return list.indexOf(v) < 0 ? def : v; }
          var m = pick(l.mode || (s.theme === "dark" ? "dark" : "light"), ["light", "auto", "dark"], "light");
          if (m === "auto") m = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          d.setAttribute("data-theme", pick(l.theme, ["blush", "sage", "sky", "lilac"], "blush"));
          d.setAttribute("data-mode", m);
          d.setAttribute("data-font", pick(l.font, ["classic", "cozy", "modern"], "classic"));
          d.setAttribute("data-bg", pick(l.bg, ["soft", "plain", "dots"], "soft"));
        } catch (e) { /* the defaults apply */ }
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="nb-topbar" id="nb-topbar" hidden>
      <a class="nb-back" href="#/home">&larr; Back to planner</a>
      <span class="nb-topbar-title">My Notebook</span>
      <span class="nb-topbar-spacer"></span>
    </header>

    <div class="app">
      <aside class="sidebar glass" id="sidebar" aria-label="Main navigation"></aside>

      <div class="main">
        <header class="topbar" id="topbar"></header>
        <main class="view" id="view" tabindex="-1"></main>
      </div>
    </div>

    <nav class="dock glass" id="dock" aria-label="Quick navigation"></nav>

    <div class="sheet-scrim" id="sheet-scrim" hidden></div>
    <section class="sheet glass" id="sheet" aria-label="All sections" hidden></section>

    <dialog id="ask" class="ask">
      <form method="dialog">
        <label id="ask-label" for="ask-input">Name</label>
        <input id="ask-input" type="text" maxlength="60" autocomplete="off">
        <div class="ask-actions">
          <button value="cancel" class="btn" formnovalidate>Cancel</button>
          <button value="ok" class="btn pink" id="ask-ok">Save</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>

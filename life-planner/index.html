<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Slow Ink Life — Digital Planner</title>
    <meta
      name="description"
      content="Slow Ink Life is a soft, neumorphic all-in-one digital planner — linked yearly, monthly, weekly and daily spreads with reflection reviews, plus hubs for habits and fitness, meals, finance, mental wellbeing, travel, home care and a multi-paper notebook."
    />
    <meta name="theme-color" content="#EFEBE7" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23EFEBE7'/%3E%3Ccircle cx='20' cy='20' r='11' fill='%23F2C4CE'/%3E%3Ccircle cx='24' cy='16' r='5' fill='%23F7E3A1'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar glass" id="sidebar" aria-label="Main navigation"></aside>

      <div class="main">
        <header class="topbar" id="topbar"></header>
        <main class="view" id="view" tabindex="-1"></main>
      </div>
    </div>

    <nav class="dock glass" id="dock" aria-label="Quick navigation"></nav>

    <div class="sheet-scrim" id="sheet-scrim" hidden></div>
    <section class="sheet glass" id="sheet" aria-label="All sections" hidden></section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>

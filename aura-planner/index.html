<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aura — Glass Life Planner</title>
    <meta
      name="description"
      content="Aura is an interactive glassmorphic life planner — linked year, month, week and daily focus pages, life-design frameworks (Level 10 Life, Ikigai, Eisenhower, SMART goals, mind map, vision board), wellness trackers, a multi-paper notebook you can type or draw on, and an AI coach."
    />
    <meta name="theme-color" content="#F7F2FF" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23B69CFF'/%3E%3Cstop offset='1' stop-color='%23FF9ED2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='12' fill='url(%23g)'/%3E%3Ccircle cx='20' cy='20' r='9' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='20' cy='20' r='3' fill='%23fff'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <header class="ribbon glass" id="ribbon">
      <a class="brand" href="#/day/today" aria-label="Aura — go to today">
        <span class="brand-mark"></span>
        <span class="brand-name">Aura<small>life planner</small></span>
      </a>
      <nav class="groups" id="groups" aria-label="Planner sections"></nav>
      <div class="ribbon-actions">
        <a class="btn ghost sm" href="#/day/today">Today</a>
        <button class="icon-btn" data-act="open-settings" aria-label="Settings" title="Settings"></button>
      </div>
    </header>
    <nav class="subribbon" id="subnav" aria-label="Pages in this section"></nav>

    <div class="layout" id="layout">
      <main class="view" id="view" tabindex="-1"></main>
      <aside class="month-rail glass" id="rail" aria-label="Month index"></aside>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <section class="drawer glass" id="drawer" aria-label="Panel" hidden></section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/core.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/frameworks.js"></script>
    <script src="js/wellness.js"></script>
    <script src="js/notebook.js"></script>
    <script src="js/coach.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>

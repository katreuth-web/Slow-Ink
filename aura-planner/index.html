<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aura — Manifestation Planner</title>
    <meta
      name="description"
      content="Aura is a private manifestation planner for intention-setting and reflection: daily practice pages, scripting, guided visualization, affirmations, 369 and 55×5 rituals, moon phases, a manifestation tracker, a vision board and a notebook with photos and stickers."
    />
    <meta name="theme-color" content="#F7F2FF" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23B69CFF'/%3E%3Cstop offset='1' stop-color='%23FF9ED2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='12' fill='url(%23g)'/%3E%3Ccircle cx='20' cy='20' r='9' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='20' cy='20' r='3' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      /* Apply the saved look before the first paint, so there is no flash of the wrong colours. */
      (function () {
        try {
          var l = (JSON.parse(localStorage.getItem("aura-planner-v1") || "null") || {}).ui;
          l = (l && l.look) || {};
          var ok = function (v, list, d) { return list.indexOf(v) >= 0 ? v : d; };
          var mode = ok(l.mode, ["light", "auto", "dark"], "light");
          if (mode === "auto") mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var r = document.documentElement;
          r.setAttribute("data-theme", ok(l.theme, ["violet", "rose", "ocean", "meadow"], "violet"));
          r.setAttribute("data-mode", mode);
          r.setAttribute("data-font", ok(l.font, ["classic", "cozy", "modern"], "classic"));
        } catch (e) { /* the defaults apply */ }
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <header class="ribbon glass" id="ribbon">
      <a class="brand" href="#/home" aria-label="Aura — home">
        <span class="brand-mark"></span>
        <span class="brand-name">Aura<small>manifestation planner</small></span>
      </a>
      <nav class="groups" id="groups" aria-label="Planner sections"></nav>
      <div class="ribbon-actions">
        <a class="btn ghost sm" href="#/day/today">Today</a>
        <button class="icon-btn" data-act="toggle-dark" id="dark-btn" aria-label="Switch light or dark" title="Light / dark"></button>
        <button class="icon-btn" data-act="open-look" id="look-btn" aria-label="Personalise colours and fonts" title="Personalise"></button>
        <button class="icon-btn" data-act="open-settings" aria-label="Settings" title="Settings"></button>
      </div>
    </header>
    <nav class="subribbon" id="subnav" aria-label="Pages in this section"></nav>

    <header class="nb-topbar" id="nb-topbar" hidden>
      <a class="nb-back" href="#/home">&larr; Back to planner</a>
      <span class="nb-topbar-title">My Notebook</span>
      <span class="nb-topbar-spacer"></span>
    </header>

    <div class="layout" id="layout">
      <main class="view" id="view" tabindex="-1"></main>
      <aside class="month-rail glass" id="rail" aria-label="Month index"></aside>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <section class="drawer glass" id="drawer" aria-label="Panel" hidden></section>
    <dialog id="ask" class="ask glass">
      <form method="dialog">
        <label id="ask-label" for="ask-input">Name</label>
        <input id="ask-input" class="field" type="text" maxlength="60" autocomplete="off" />
        <div class="ask-actions">
          <button value="cancel" class="btn ghost sm" formnovalidate>Cancel</button>
          <button value="ok" class="btn sm" id="ask-ok">Save</button>
        </div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/core.js"></script>
    <script src="js/stickers.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/frameworks.js"></script>
    <script src="js/dream.js"></script>
    <script src="js/wellness.js"></script>
    <script src="js/practice.js"></script>
    <script src="js/manifest.js"></script>
    <script src="js/notebook.js"></script>
    <script src="js/coach.js"></script>
    <script src="js/look.js"></script>
    <script src="js/home.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>

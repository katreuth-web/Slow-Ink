<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Slow Ink Sage — Yearly Planner &amp; Notebook</title>
    <meta name="description" content="A warm, paper-and-sage yearly planner with a notebook of its own. Works offline: no accounts, no sign-up, your notes stay on your device." />
    <meta name="theme-color" content="#F4EEE0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%232F4A3A'/%3E%3Cpath d='M20 9c5 4.6 7.4 8.6 7.4 12.4A7.4 7.4 0 0 1 20 29a7.4 7.4 0 0 1-7.4-7.6C12.6 17.600 15 13.600 20 9z' fill='%23F4EEE0'/%3E%3Cpath d='M20 15v13' stroke='%232F4A3A' stroke-width='1.800' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar" id="topbar">
        <a class="brand" href="#/today" aria-label="Slow Ink Sage — Today">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Slow Ink</span>
        </a>
        <a class="nb-quick" href="#/notebook">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.500h11a3 3 0 0 1 3 3V19.500H8a3 3 0 0 1-3-3z"/><path d="M5 16.500a3 3 0 0 1 3-3h11"/></svg>Notebook
        </a>
        <nav class="tabs" id="tabs" aria-label="Planner sections"></nav>
      </header>

      <header class="nb-topbar" id="nb-topbar" hidden>
        <a class="nb-back" href="#/today" id="nb-back">&larr; Back to planner</a>
        <span class="nb-topbar-title">My Notebook</span>
        <span class="nb-topbar-spacer"></span>
      </header>

      <main class="page" id="view" tabindex="-1"></main>

      <footer class="foot" id="foot">
        <span>Everything you write stays on this device.</span>
        <button class="linklike" data-act="export">Back up planner</button>
        <button class="linklike" data-act="load-sample">Try sample data</button>
        <label class="linklike">
          Restore backup
          <input type="file" id="import-file" accept="application/json,.json" hidden />
        </label>
      </footer>
    </div>

    <dialog id="ask" class="ask">
      <form method="dialog" id="ask-form">
        <label id="ask-label" for="ask-input">Name</label>
        <input id="ask-input" type="text" maxlength="60" autocomplete="off" />
        <div class="ask-actions">
          <button value="cancel" class="btn ghost" formnovalidate>Cancel</button>
          <button value="ok" class="btn" id="ask-ok">Save</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/core.js"></script>
    <script src="js/images.js"></script>
    <script src="js/stickers.js"></script>
    <script src="js/sample.js"></script>
    <script src="js/views.js"></script>
    <script src="js/notebook.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
